providers:
  - cursor
options:
  toolExposure: on-demand
  requiresCommands:
    - cli: node
      description: Required to run owl-mcp
    - cli: semlocal
      description: Required for local semantic memory (npm install -g semlocal)
    - cli: curl
      description: Required to search the EBI OLS4 API
skills:
  - id: capabilities-manager
    type: github
    def:
      repo: infragate/capa@capabilities-manager
      description: Guide for managing capabilities with capa CLI
      requires:
        - install
        - find_skills
  - id: odp-pattern-selector
    type: local
    def:
      path: ./skills/odp-pattern-selector
      description: Select a pattern from the ODP pattern library
  - id: cq-verification
    type: local
    def:
      path: ./skills/cq-verification
      description: >-
        Verify competency questions against an OWL ontology using SPARQL queries
        with test data. Use during Step 7, or whenever the user asks to test,
        validate, or verify an ontology against its CQs.
      requires:
        - '@owl.add_axiom'
        - '@owl.add_axioms'
        - '@owl.add_prefix'
        - '@owl.set_ontology_iri'
        - '@owl.find_axioms'
        - '@owl.sparql_query'
        - '@owl.check_consistency'
  - id: ontology-editor
    type: local
    def:
      path: ./skills/ontology-editor
      description: OWL-MCP tools for ontology editing (axioms, prefixes, IRI, pitfalls)
      requires:
        - '@owl.add_axiom'
        - '@owl.add_axioms'
        - '@owl.remove_axiom'
        - '@owl.find_axioms'
        - '@owl.get_all_axioms'
        - '@owl.add_prefix'
        - '@owl.ontology_metadata'
        - '@owl.get_labels_for_iri'
        - '@owl.set_ontology_iri'
        - '@owl.test_pitfalls'
  - id: semlocal
    type: remote
    def:
      url: https://raw.githubusercontent.com/Minitour/semlocal/refs/heads/main/skills/semlocal/SKILL.md
      description: >-
        Store, search, and delete text using local semantic search (semlocal CLI).
        Use for long-term memory, knowledge extraction, and recall across sessions.
      requires: []
  - id: analyze-project
    type: local
    def:
      path: ./skills/analyze-project
      description: >-
        Understand a target ontology repo (structure, CONTRIBUTING, issue/PR
        conventions). Use when user wants to analyze a repo or learn how to
        contribute.
  - id: clone-project
    type: local
    def:
      path: ./skills/clone-project
      description: >-
        Clone an ontology repo into projects/<slug>/; all later work is done
        from that directory. Use when user wants to clone or set up a repo
        locally.
  - id: review-issue
    type: local
    def:
      path: ./skills/review-issue
      description: >-
        Summarize and triage ontology repo issues (NTR, synonym, etc.).
        Use when user wants to review an issue or find good first issues.
  - id: create-pull-request
    type: local
    def:
      path: ./skills/create-pull-request
      description: >-
        From project directory, create branch, commit, push, and open PR.
        Use when user wants to create a PR for their changes or for an issue.
  - id: ontology-reuse
    type: local
    def:
      path: ./skills/ontology-reuse
      description: >-
        Search ontology registries (OLS, OBO Foundry, BioPortal) for existing
        terms to reuse. Use during Steps 2–3, or when the user asks to find,
        look up, or reuse existing ontology terms.
      requires:
        - ols_search
agents:
  base:
    type: local
    path: ./.workflow/workflow.md
  additional:
    - type: inline
      id: capa_tool_usage
      content: >-
        Tools are provided by the capa MCP server. Preferred path: after learning
        a skill, call `setup_tools(skills: ["<skill-id>"])` to activate it, then
        `call_tool(name: "<tool>", data: {...})`. If the MCP tools are not
        available (e.g. the editor hasn't reloaded the server after `capa
        install`), use the equivalent CLI via the terminal instead — it drives
        the same tools without the MCP client. Run `capa sh` to list everything,
        `capa sh owl` to list the owl-mcp tools, and `capa sh owl <tool> --flag
        value` to invoke one. Tool and flag names are kebab-case (e.g.
        `check_consistency` → `capa sh owl check-consistency`,
        `owl_file_paths` → `--owl-file-paths`); repeat a flag to pass array
        values; use absolute, quoted file paths; results are printed as JSON.
        Example: `capa sh owl sparql-query --owl-file-paths "C:/abs/ont.owl"
        --owl-file-paths "C:/abs/data.owl" --with-reasoning false --query
        "SELECT ..."`. The capa server must be running (`capa start`); `capa
        restart` also clears stale in-memory ontology state between builds.
    - type: inline
      id: ontology_builder_tools
      content: >-
        For ontology work, use the owl-mcp tools only (never edit OWL by hand):
        editing/annotation via the ontology-editor tools, logical consistency
        via check_consistency, and CQ verification via sparql_query (pass
        multiple owl_file_paths to merge schema + test data in-memory). Use
        absolute file paths for all owl-mcp tool calls.
    - type: inline
      id: external_ontology_contribution
      content: >-
        For contributing to an external ontology, use analyze-project, then
        clone-project (into projects/), then review-issue, then implement the
        change with the ontology-editor tools, then create-pull-request. QC is
        run by the target repository's own CI on the pull request; do not run QC
        locally. Follow the target repo's CONTRIBUTING and PR checklist.
servers:
  # Minitour/owl-mcp (Rust): https://github.com/Minitour/owl-mcp
  - id: owl
    type: mcp
    description: OWL ontology editing via MCP (find/add/remove axioms, OWL functional syntax)
    def:
      cmd: npx
      args:
        - -y
        - owl-mcp@1.0.14
        - serve
tools:
  - id: add_axioms
    type: mcp
    description: Add multiple axioms to an OWL file
    def:
      server: '@owl'
      tool: add_axioms
  - id: remove_axiom
    type: mcp
    description: Remove one axiom from an OWL file
    def:
      server: '@owl'
      tool: remove_axiom
  - id: find_axioms
    type: mcp
    description: Find axioms matching a pattern in an OWL file
    def:
      server: '@owl'
      tool: find_axioms
  - id: get_all_axioms
    type: mcp
    description: Get all axioms from an OWL file
    def:
      server: '@owl'
      tool: get_all_axioms
  - id: add_prefix
    type: mcp
    description: Add a prefix mapping to an OWL file
    def:
      server: '@owl'
      tool: add_prefix
  - id: ontology_metadata
    type: mcp
    description: Get ontology metadata/annotations
    def:
      server: '@owl'
      tool: ontology_metadata
  - id: get_labels_for_iri
    type: mcp
    description: Get labels for an IRI in an OWL file
    def:
      server: '@owl'
      tool: get_labels_for_iri
  - id: set_ontology_iri
    type: mcp
    description: Set or update the ontology IRI and version IRI
    def:
      server: '@owl'
      tool: set_ontology_iri
  - id: test_pitfalls
    type: mcp
    description: Scan for common modeling pitfalls in an OWL file
    def:
      server: '@owl'
      tool: test_pitfalls
  - id: sparql_query
    type: mcp
    description: >-
      Run a SPARQL query over one or more OWL files (multiple paths are merged
      in-memory). Set with_reasoning to materialize OWL 2 EL entailments before
      querying.
    def:
      server: '@owl'
      tool: sparql_query
  - id: check_consistency
    type: mcp
    description: >-
      Run an OWL 2 EL reasoner (whelk) over one or more OWL files and report
      logical consistency and unsatisfiable classes. Replaces robot reason.
    def:
      server: '@owl'
      tool: check_consistency
  - id: ols_search
    type: command
    description: >-
      Search the EBI OLS4 API for ontology entities. Returns matching entities
      with facets for ontologyId and type, filtered to defining ontologies.
    def:
      run:
        cmd: curl -s -G "https://www.ebi.ac.uk/ols4/api/v2/entities" --data-urlencode "search={query}" --data-urlencode "facetFields=ontologyId type" -d "size=10" -d "page={page}" -d "isDefiningOntology=true"
        args:
          - name: query
            type: string
            description: >-
              Search query (e.g. "cancer related fatigue"). Spaces are
              URL-encoded automatically.
            required: true
          - name: page
            type: string
            description: Page number for paginated results (defaults to 0).
            required: false
            default: "0"